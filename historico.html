<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CenterTech - Histórico</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 6px 0 0;
            opacity: 0.8;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .titulo {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .titulo h2 {
            margin: 0;
        }

        .registro {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vaga {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            font-weight: bold;
        }

        .livre {
            color: #16a34a;
        }

        .ocupada {
            color: #ef4444;
        }

        .data {
            color: #666;
            font-size: 14px;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<header>

    <h1>🚗 CenterTech</h1>

    <p>
        Histórico de ocupação das vagas
    </p>

</header>


<div class="container">

    <div class="titulo">

        <h2>📋 Últimas movimentações</h2>

    </div>


    <div id="historico">

        Carregando histórico...

    </div>


    <a href="/mapa" class="voltar">
        ← Voltar para o mapa
    </a>

</div>


<script>

async function carregarHistorico() {

    try {

        const resposta = await fetch('/historico');

        const registros = await resposta.json();

        const container =
            document.getElementById('historico');

        container.innerHTML = '';


        if (registros.length === 0) {

            container.innerHTML =
                '<p>Nenhum registro encontrado.</p>';

            return;

        }


        registros.forEach(registro => {

            const div =
                document.createElement('div');

            div.className = 'registro';


            const status =
                registro.status.toUpperCase();


            const data =
                new Date(registro.data_hora);


            const dataFormatada =
                data.toLocaleString('pt-BR');


            div.innerHTML = `

                <div>

                    <div class="vaga">
                        🚗 ${registro.vaga}
                    </div>

                    <div class="status ${registro.status}">
                        ${status}
                    </div>

                </div>


                <div class="data">

                    ${dataFormatada}

                </div>

            `;


            container.appendChild(div);

        });

    }

    catch (erro) {

        console.error(
            'Erro ao carregar histórico:',
            erro
        );

        document.getElementById('historico').innerHTML =
            '<p>Erro ao carregar o histórico.</p>';

    }

}


carregarHistorico();

</script>

</body>

</html>
