<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CenterTech</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
    background: #111827;
    color: white;
    padding: 12px 18px;
    text-align: center;
    position: relative;
    z-index: 1000;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 3px 0 0;
    opacity: 0.8;
    font-size: 14px;
}

        #map {
            height: calc(100vh - 90px);
            width: 100%;
        }

        .info {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .livre {
            color: green;
            font-weight: bold;
        }

        .ocupada {
            color: red;
            font-weight: bold;
        }
        .painel {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 14px;
}

.painel span {
    background: rgba(255, 255, 255, 0.08);
    padding: 5px 10px;
    border-radius: 20px;
}

.painel strong {
    font-size: 16px;
}

    
        #painelProximas {
            position: absolute;
            z-index: 1200;
            top: 175px;
            right: 12px;
            width: min(340px, calc(100vw - 48px));
            max-height: 55vh;
            overflow-y: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 14px rgba(0,0,0,.28);
            padding: 12px;
            display: none;
            color: #111827;
            font-size: 13px;
        }
        #painelProximas h3 { margin: 0 0 8px; font-size: 16px; }
        #painelProximas .vaga-proxima {
            padding: 8px 0;
            border-top: 1px solid #e5e7eb;
        }
        #painelProximas button {
            border: 0; border-radius: 6px; padding: 7px 9px;
            background: #111827; color: white; cursor: pointer;
        }
        #btnProximas {
            margin-top: 6px; display: block; width: 100%;
            font-size: 13px; font-weight: bold;
        }
        #controleBusca {
            position: relative;
            display: flex;
            gap: 5px;
            align-items: center;
            box-sizing: border-box;
            width: min(300px, calc(100vw - 60px));
            max-width: calc(100vw - 60px);
            padding: 6px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.3);
        }
        #campoBusca {
            flex: 1 1 auto;
            min-width: 0;
            width: 0;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        #btnBuscar { flex: 0 0 auto; padding: 8px 10px; }
        #sugestoesBusca {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            display: none;
            max-height: 220px;
            overflow-y: auto;
            background: white;
            border-radius: 7px;
            box-shadow: 0 3px 12px rgba(0,0,0,.28);
            z-index: 2000;
            color: #111827;
        }
        .sugestao-endereco {
            display: block;
            width: 100%;
            border: 0;
            border-bottom: 1px solid #e5e7eb;
            background: white;
            padding: 9px 10px;
            text-align: left;
            font-size: 12px;
            line-height: 1.35;
            cursor: pointer;
        }
        .sugestao-endereco:hover, .sugestao-endereco:focus { background: #f3f4f6; }
        @media (max-width: 600px) {
            #painelProximas { top: 165px; right: 8px; }
            #controleBusca { width: min(280px, calc(100vw - 58px)); }
        }

    </style>
</head>

<body>

<header>
    <h1>🚗 CenterTech</h1>
    <p>Sistema inteligente de estacionamento urbano</p>

    <div class="painel">
    <span>🟢 Livres: <strong id="livres">0</strong></span>

    <span>🔴 Ocupadas: <strong id="ocupadas">0</strong></span>

    <span>🅿️ Total: <strong id="total">0</strong></span>

    <span>📊 Ocupação: <strong id="ocupacao">0%</strong></span>
</div>
</header>

<div id="map"></div>
<div id="painelProximas" role="region" aria-label="Vagas próximas">
    <h3>📍 Vagas próximas de mim</h3>
    <p id="estadoProximas">Toque em “Encontrar vagas próximas” para usar sua localização.</p>
    <div id="listaProximas"></div>
    <button type="button" id="fecharProximas">Fechar</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // Centro inicial do mapa
    const mapa = L.map('map').setView(
    [-23.0880, -47.2164],
    18
);

// Botão de localização
const botaoLocalizacao = L.control({ position: 'topright' });

botaoLocalizacao.onAdd = function() {
    const div = L.DomUtil.create('div');

    div.innerHTML = `
        <button id="btnLocalizacao" style="
            background:white;
            border:none;
            border-radius:8px;
            padding:10px 12px;
            font-size:20px;
            cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,0.3);
        ">
            📍
        </button>
        <button id="btnProximas" style="
            background:#111827;
            color:white;
            border:none;
            border-radius:8px;
            padding:9px 10px;
            font-size:13px;
            font-weight:bold;
            cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,0.3);
        ">Vagas próximas</button>
    `;

    return div;
};

botaoLocalizacao.addTo(mapa);

let marcadorUsuario = null;
let circuloPrecisao = null;
let ultimaLocalizacaoUsuario = null;
let vagasCache = [];

function distanciaMetros(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const rad = valor => valor * Math.PI / 180;
    const dLat = rad(lat2 - lat1);
    const dLon = rad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) *
        Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatarDistancia(metros) {
    return metros < 1000
        ? `${Math.round(metros)} m`
        : `${(metros / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 2})} km`;
}

function exibirVagasProximas() {
    const painel = document.getElementById('painelProximas');
    const estado = document.getElementById('estadoProximas');
    const lista = document.getElementById('listaProximas');
    painel.style.display = 'block';
    lista.innerHTML = '';

    if (!ultimaLocalizacaoUsuario) {
        estado.textContent = 'Obtendo sua localização…';
        return;
    }

    const {lat, lng} = ultimaLocalizacaoUsuario;
    const proximas = vagasCache
        .filter(v => Number.isFinite(v.latitude) && Number.isFinite(v.longitude))
        .map(v => ({...v, distancia: distanciaMetros(lat, lng, v.latitude, v.longitude)}))
        .sort((a, b) => a.distancia - b.distancia);

    if (!proximas.length) {
        estado.textContent = 'Não foi possível encontrar vagas com coordenadas cadastradas.';
        return;
    }

    const livres = proximas.filter(v => v.status === 'livre');
    estado.textContent = livres.length
        ? `Encontramos ${livres.length} vaga(s) livre(s). Mostrando as mais próximas primeiro.`
        : 'No momento, não há vagas livres cadastradas próximas. Veja as vagas ocupadas abaixo.';

    proximas.slice(0, 6).forEach(vaga => {
        const linha = document.createElement('div');
        linha.className = 'vaga-proxima';
        const status = vaga.status === 'livre' ? '🟢 Livre' : '🔴 Ocupada';
        linha.innerHTML = `
            <div><strong>${vaga.codigo}</strong> — ${status}</div>
            <div>Distância em linha reta: ${formatarDistancia(vaga.distancia)}</div>
            <button type="button">Ver no mapa</button>
        `;
        linha.querySelector('button').onclick = () => {
            mapa.setView([vaga.latitude, vaga.longitude], 19);
            const marcador = marcadores[vaga.codigo];
            if (marcador) marcador.openPopup();
        };
        lista.appendChild(linha);
    });
}

function localizarUsuario(mostrarProximas = false) {
    if (!navigator.geolocation) {
        alert('Este navegador não oferece suporte à localização.');
        return;
    }
    if (mostrarProximas) {
        document.getElementById('painelProximas').style.display = 'block';
        document.getElementById('estadoProximas').textContent = 'Solicitando permissão de localização…';
    }

    navigator.geolocation.getCurrentPosition(
        posicao => {
            const lat = posicao.coords.latitude;
            const lng = posicao.coords.longitude;
            ultimaLocalizacaoUsuario = {lat, lng};

            if (marcadorUsuario) mapa.removeLayer(marcadorUsuario);
            if (circuloPrecisao) mapa.removeLayer(circuloPrecisao);

            const iconeUsuario = L.divIcon({
                className: '',
                html: '<div style="width:12px;height:12px;background:#2563eb;border:2px solid #fff;border-radius:2px;box-shadow:0 1px 5px rgba(0,0,0,.45);"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            marcadorUsuario = L.marker([lat, lng], {icon: iconeUsuario})
                .addTo(mapa).bindPopup('Você está aqui');

            circuloPrecisao = L.circle([lat, lng], {
                radius: posicao.coords.accuracy || 30,
                color: '#2563eb', weight: 1, fillOpacity: 0.08
            }).addTo(mapa);

            mapa.setView([lat, lng], 18);
            if (mostrarProximas) exibirVagasProximas();
        },
        erro => {
            const mensagens = {
                1: 'Permita o acesso à localização no navegador para encontrar vagas próximas.',
                2: 'Não foi possível determinar sua localização. Verifique o GPS ou a conexão.',
                3: 'A localização demorou demais. Tente novamente.'
            };
            alert(mensagens[erro.code] || 'Não foi possível obter sua localização.');
            if (mostrarProximas) {
                document.getElementById('estadoProximas').textContent =
                    'Não foi possível obter a localização. Permita o acesso no navegador e tente novamente.';
            }
        },
        {enableHighAccuracy: true, timeout: 15000, maximumAge: 10000}
    );
}

document.getElementById('btnLocalizacao').onclick = () => localizarUsuario(false);
document.getElementById('btnProximas').onclick = () => localizarUsuario(true);
document.getElementById('fecharProximas').onclick = () => {
    document.getElementById('painelProximas').style.display = 'none';
};

// Barra de pesquisa de endereço
const busca = L.control({ position: 'topleft' });

busca.onAdd = function() {

    const div = L.DomUtil.create('div');

    div.innerHTML = `
        <div id="controleBusca">
            <input id="campoBusca" type="text" placeholder="Pesquisar endereço" autocomplete="off" aria-label="Pesquisar endereço">
            <button id="btnBuscar" style="border:none;border-radius:5px;background:#111827;color:white;cursor:pointer;">Buscar</button>
            <div id="sugestoesBusca" role="listbox"></div>
        </div>
    `;

    L.DomEvent.disableClickPropagation(div);

    return div;
};

busca.addTo(mapa);

const campoBusca = document.getElementById('campoBusca');
const sugestoesBusca = document.getElementById('sugestoesBusca');
let temporizadorBusca = null;
let marcadorPesquisa = null;
let resultadosBusca = [];

function esconderSugestoes() {
    sugestoesBusca.style.display = 'none';
    sugestoesBusca.innerHTML = '';
}

function selecionarEndereco(resultado) {
    const latitude = Number(resultado.lat);
    const longitude = Number(resultado.lon);
    campoBusca.value = resultado.display_name;
    esconderSugestoes();
    mapa.setView([latitude, longitude], 18);
    if (marcadorPesquisa) mapa.removeLayer(marcadorPesquisa);
    marcadorPesquisa = L.marker([latitude, longitude]).addTo(mapa)
        .bindPopup(resultado.display_name).openPopup();
}

async function buscarSugestoes() {
    const termo = campoBusca.value.trim();
    if (termo.length < 3) {
        esconderSugestoes();
        return;
    }
    try {
        const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=br&q=' + encodeURIComponent(termo);
        const resposta = await fetch(url, {headers: {'Accept-Language': 'pt-BR'}});
        if (!resposta.ok) throw new Error('Falha ao pesquisar endereço');
        resultadosBusca = await resposta.json();
        sugestoesBusca.innerHTML = '';
        if (!resultadosBusca.length) {
            sugestoesBusca.innerHTML = '<div style="padding:10px;font-size:12px">Nenhum endereço encontrado.</div>';
        } else {
            resultadosBusca.forEach(resultado => {
                const botao = document.createElement('button');
                botao.type = 'button';
                botao.className = 'sugestao-endereco';
                botao.textContent = resultado.display_name;
                botao.setAttribute('role', 'option');
                botao.addEventListener('click', () => selecionarEndereco(resultado));
                sugestoesBusca.appendChild(botao);
            });
        }
        sugestoesBusca.style.display = 'block';
    } catch (erro) {
        console.error('Erro ao sugerir endereços:', erro);
        esconderSugestoes();
    }
}

campoBusca.addEventListener('input', () => {
    clearTimeout(temporizadorBusca);
    temporizadorBusca = setTimeout(buscarSugestoes, 450);
});

campoBusca.addEventListener('keydown', event => {
    if (event.key === 'Escape') esconderSugestoes();
    if (event.key === 'Enter') {
        event.preventDefault();
        if (resultadosBusca.length) selecionarEndereco(resultadosBusca[0]);
        else buscarSugestoes();
    }
});

document.getElementById('btnBuscar').onclick = async function() {
    if (resultadosBusca.length) {
        selecionarEndereco(resultadosBusca[0]);
        return;
    }
    await buscarSugestoes();
    if (resultadosBusca.length) selecionarEndereco(resultadosBusca[0]);
};

document.addEventListener('click', event => {
    if (!event.target.closest('#controleBusca')) esconderSugestoes();
});

    // Mapa OpenStreetMap
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(mapa);


    // Guarda os marcadores das vagas
    const marcadores = {};


    // Cria o marcador de uma vaga
    function criarMarcador(vaga) {

        let cor;

        if (vaga.status === "livre") {
            cor = "green";
        } else {
            cor = "red";
        }



const icone = L.divIcon({
    className: '',
    html: `
        <div style="
            width: 42px;
            height: 42px;
            background: ${cor};
            border: 3px solid white;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        ">
            <span style="
                color: white;
                font-weight: bold;
                font-size: 11px;
                transform: rotate(45deg);
            ">
                ${vaga.codigo}
            </span>
        </div>
    `,
    iconSize: [48, 48],
    iconAnchor: [24, 48]
});

        return L.marker(
            [vaga.latitude, vaga.longitude],
            { icon: icone }
        );
    }


    // Busca as vagas na API
    async function atualizarVagas() {

        try {

            const resposta = await fetch('/vagas');

            const vagas = await resposta.json();
            vagasCache = vagas;

            let livres = 0;
let ocupadas = 0;

vagas.forEach(vaga => {
    if (vaga.status === "livre") {
        livres++;
    } else {
        ocupadas++;
    }
});

let total = vagas.length;
let percentual = 0;

if (total > 0) {
    percentual = Math.round((ocupadas / total) * 100);
}

document.getElementById("livres").textContent = livres;
document.getElementById("ocupadas").textContent = ocupadas;
document.getElementById("total").textContent = total;
document.getElementById("ocupacao").textContent = percentual + "%";

if (ultimaLocalizacaoUsuario &&
    document.getElementById('painelProximas').style.display !== 'none') {
    exibirVagasProximas();
}

vagas.forEach(vaga => {

    const marcadorExistente = marcadores[vaga.codigo];

    // Se o marcador já existe e o status não mudou,
    // não recria o marcador
    if (
        marcadorExistente &&
        marcadorExistente._status === vaga.status
    ) {
        return;
    }

    // Se o marcador existe e o status mudou, remove o antigo
    if (marcadorExistente) {
        mapa.removeLayer(marcadorExistente);
    }

    const marcador = criarMarcador(vaga);

    marcador._status = vaga.status;

    marcador.bindPopup(`
    <div class="info" style="
    min-width:170px;
    max-width:190px;
    font-size:13px;
    ">

        <h3 style="
    margin:0 0 8px 0;
    font-size:16px;
">
    🚗 ${vaga.codigo}
</h3>

        <p style="margin:4px 0;">
    <strong>Status:</strong>
    <span class="${vaga.status}">
        ${vaga.status.toUpperCase()}
    </span>
</p>

<p style="margin:4px 0;">
    <strong>ID da vaga:</strong> ${vaga.id}
</p>

<p style="margin:4px 0;">
    <strong>Local:</strong><br>
    Praça Prudente de Moraes
</p>

        <hr style="margin:8px 0;">

        <h4 style="
    margin:8px 0 6px 0;
    font-size:14px;
">
    📋 Histórico recente
</h4>

        <div id="historico-${vaga.codigo}">
            Carregando histórico...
        </div>

                    </div>
    `, {
        closeButton: true,
        autoClose: true,
        closeOnClick: true,
        maxWidth: 220,
        minWidth: 180
    });


marcador.on('popupopen', async function() {

    const container =
        document.getElementById(`historico-${vaga.codigo}`);

    if (!container) {
        return;
    }

    try {

        const resposta =
            await fetch('/historico');

        const historico =
            await resposta.json();

        const registrosVaga =
            historico.filter(
                registro => registro.vaga === vaga.codigo
            );

        if (registrosVaga.length === 0) {

            container.innerHTML =
                '<p>Nenhum histórico encontrado.</p>';

            return;
        }

        container.innerHTML = '';

        registrosVaga.slice(0, 3).forEach(registro => {

            const data =
                new Date(registro.data_hora);

            const dataFormatada =
                data.toLocaleString('pt-BR');

            const statusTexto =
                registro.status === 'livre'
                    ? '🟢 Livre'
                    : '🔴 Ocupada';

            const linha =
                document.createElement('div');

            linha.style.marginBottom = '4px';
linha.style.fontSize = '12px';

            linha.innerHTML = `
                <div>
                    <strong>${statusTexto}</strong>
                </div>

                <div style="
                    color:#666;
                    font-size:12px;
                ">
                    ${dataFormatada}
                </div>
            `;

            container.appendChild(linha);

        });

    } catch (erro) {

        console.error(
            'Erro ao carregar histórico:',
            erro
        );

        container.innerHTML =
            '<p>Erro ao carregar histórico.</p>';
    }

});

    marcador.addTo(mapa);

    marcadores[vaga.codigo] = marcador;

});

        } catch (erro) {

            console.error(
                "Erro ao buscar vagas:",
                erro
            );

        }
    }


    // Primeira atualização
    atualizarVagas();

    // Atualiza a cada 5 segundos
    setInterval(atualizarVagas, 5000);

</script>

</body>
</html>
