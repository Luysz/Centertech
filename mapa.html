<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // Centro inicial do mapa
    const mapa = L.map('map').setView(
    [-23.0880, -47.2164],
    18
);

// Botão de localização
const botaoLocalizacao = L.control({ position: 'topleft' });

botaoLocalizacao.onAdd = function() {
    const div = L.DomUtil.create('div');
    div.id = "controlesLocalizacao";

    div.innerHTML = `
        <button id="btnLocalizacao" type="button" title="Minha localização" aria-label="Minha localização" style="
            background:white;
            border:none;
            border-radius:6px;
            padding:0;
            width:34px;
            height:34px;
            font-size:16px;
            line-height:1;
            cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,0.3);
        ">
            📍
        </button>
        <button id="btnProximas" style="
            background:#111827;
            color:white;
            border:none;
            border-radius:8px;
            padding:9px 10px;
            font-size:13px;
            font-weight:bold;
            cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,0.3);
        ">Vagas próximas</button>
    `;

    return div;
};

botaoLocalizacao.addTo(mapa);

let marcadorUsuario = null;
let circuloPrecisao = null;
let ultimaLocalizacaoUsuario = null;
let vagasCache = [];
let camadaRota = null;

function distanciaMetros(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const rad = valor => valor * Math.PI / 180;
    const dLat = rad(lat2 - lat1);
    const dLon = rad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) *
        Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatarDistancia(metros) {
    return metros < 1000
        ? `${Math.round(metros)} m`
        : `${(metros / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 2})} km`;
}

function exibirVagasProximas() {
    const painel = document.getElementById('painelProximas');
    const estado = document.getElementById('estadoProximas');
    const lista = document.getElementById('listaProximas');
    painel.style.display = 'block';
    lista.innerHTML = '';

    if (!ultimaLocalizacaoUsuario) {
        estado.textContent = 'Obtendo sua localização…';
        return;
    }

    const {lat, lng} = ultimaLocalizacaoUsuario;
    const proximas = vagasCache
        .filter(v => Number.isFinite(v.latitude) && Number.isFinite(v.longitude))
        .map(v => ({...v, distancia: distanciaMetros(lat, lng, v.latitude, v.longitude)}))
        .sort((a, b) => a.distancia - b.distancia);

    if (!proximas.length) {
        estado.textContent = 'Não foi possível encontrar vagas com coordenadas cadastradas.';
        return;
    }

    const livres = proximas.filter(v => v.status === 'livre');
    estado.textContent = livres.length
        ? `Encontramos ${livres.length} vaga(s) livre(s). Mostrando as mais próximas primeiro.`
        : 'No momento, não há vagas livres cadastradas próximas. Veja as vagas ocupadas abaixo.';

    proximas.slice(0, 6).forEach(vaga => {
        const linha = document.createElement('div');
        linha.className = 'vaga-proxima';
        const status = vaga.status === 'livre' ? '🟢 Livre' : '🔴 Ocupada';
        linha.innerHTML = `
            <div><strong>${vaga.codigo}</strong> — ${status}</div>
            <div>Distância em linha reta: ${formatarDistancia(vaga.distancia)}</div>
            <button type="button">Traçar rota</button>
        `;
        linha.querySelector('button').textContent = 'Traçar rota no mapa';
        linha.querySelector('button').onclick = async () => {
            if (!ultimaLocalizacaoUsuario) {
                localizarUsuario(true);
                return;
            }

            const botaoRota = linha.querySelector('button');
            botaoRota.disabled = true;
            botaoRota.textContent = 'Calculando rota…';
            estado.textContent = `Calculando o trajeto até ${vaga.codigo}…`;

            try {
                // OSRM recebe coordenadas na ordem longitude,latitude.
                const origem = `${ultimaLocalizacaoUsuario.lng},${ultimaLocalizacaoUsuario.lat}`;
                const destino = `${vaga.longitude},${vaga.latitude}`;
                const url = `https://router.project-osrm.org/route/v1/driving/${origem};${destino}?overview=full&geometries=geojson&steps=true`;
                const resposta = await fetch(url);

                if (!resposta.ok) throw new Error('O serviço de rotas não respondeu.');
                const dados = await resposta.json();

                if (dados.code !== 'Ok' || !dados.routes || !dados.routes.length) {
                    throw new Error('Não foi possível encontrar uma rota viária para esta vaga.');
                }

                if (camadaRota) mapa.removeLayer(camadaRota);

                const rota = dados.routes[0];
                const coordenadas = rota.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
                camadaRota = L.polyline(coordenadas, {
                    color: '#2563eb',
                    weight: 6,
                    opacity: 0.9,
                    lineJoin: 'round'
                }).addTo(mapa);

                mapa.fitBounds(camadaRota.getBounds(), {padding: [45, 45]});
                L.popup()
                    .setLatLng([vaga.latitude, vaga.longitude])
                    .setContent(`<strong>${vaga.codigo}</strong><br>Trajeto: ${formatarDistancia(rota.distance)}<br>Tempo estimado: ${Math.max(1, Math.round(rota.duration / 60))} min`)
                    .openOn(mapa);

                estado.textContent = `Rota até ${vaga.codigo}: ${formatarDistancia(rota.distance)} · aproximadamente ${Math.max(1, Math.round(rota.duration / 60))} min.`;
                botaoRota.textContent = 'Atualizar rota';
            } catch (erro) {
                console.error('Erro ao calcular rota:', erro);
                estado.textContent = erro.message || 'Não foi possível calcular a rota. Tente novamente.';
                botaoRota.textContent = 'Tentar novamente';
            } finally {
                botaoRota.disabled = false;
            }
        };
        lista.appendChild(linha);
    });
}

function localizarUsuario(mostrarProximas = false) {
    if (!navigator.geolocation) {
        alert('Este navegador não oferece suporte à localização.');
        return;
    }
    if (mostrarProximas) {
        document.getElementById('painelProximas').style.display = 'block';
        document.getElementById('estadoProximas').textContent = 'Solicitando permissão de localização…';
    }

    navigator.geolocation.getCurrentPosition(
        posicao => {
            const lat = posicao.coords.latitude;
            const lng = posicao.coords.longitude;
            ultimaLocalizacaoUsuario = {lat, lng};

            if (marcadorUsuario) mapa.removeLayer(marcadorUsuario);
            if (circuloPrecisao) mapa.removeLayer(circuloPrecisao);

            marcadorUsuario = L.circleMarker([lat, lng], {
                radius: 9, color: '#ffffff', weight: 3,
                fillColor: '#2563eb', fillOpacity: 1
            }).addTo(mapa).bindPopup('📍 Você está aqui');

            circuloPrecisao = L.circle([lat, lng], {
                radius: posicao.coords.accuracy || 30,
                color: '#2563eb', weight: 1, fillOpacity: 0.08
            }).addTo(mapa);

            mapa.setView([lat, lng], 18);
            if (mostrarProximas) exibirVagasProximas();
        },
        erro => {
            const mensagens = {
                1: 'Permita o acesso à localização no navegador para encontrar vagas próximas.',
                2: 'Não foi possível determinar sua localização. Verifique o GPS ou a conexão.',
                3: 'A localização demorou demais. Tente novamente.'
            };
            alert(mensagens[erro.code] || 'Não foi possível obter sua localização.');
            if (mostrarProximas) {
                document.getElementById('estadoProximas').textContent =
                    'Não foi possível obter a localização. Permita o acesso no navegador e tente novamente.';
            }
        },
        {enableHighAccuracy: true, timeout: 15000, maximumAge: 10000}
    );
}

document.getElementById('btnLocalizacao').onclick = () => localizarUsuario(false);
document.getElementById('btnProximas').onclick = () => localizarUsuario(true);
document.getElementById('fecharProximas').onclick = () => {
    document.getElementById('painelProximas').style.display = 'none';
};

mapa.zoomControl.setPosition('topleft');
setTimeout(() => {

    const localEl = document.getElementById('controlesLocalizacao')?.closest('.leaflet-control');

const campoBusca = document.getElementById('campoBusca');
const sugestoesBusca = document.getElementById('sugestoesBusca');
let temporizadorBusca = null;
let resultadosBusca = [];
let marcadorBusca = null;

function selecionarEndereco(resultado) {
    const latitude = parseFloat(resultado.lat);
    const longitude = parseFloat(resultado.lon);
    campoBusca.value = resultado.display_name;
    sugestoesBusca.style.display = 'none';
    mapa.setView([latitude, longitude], 18);
    if (marcadorBusca) mapa.removeLayer(marcadorBusca);
    marcadorBusca = L.marker([latitude, longitude]).addTo(mapa)
        .bindPopup(resultado.display_name).openPopup();
}

async function buscarEnderecos(mostrarAlerta = false) {
    const endereco = campoBusca.value.trim();
    if (!endereco) {
        sugestoesBusca.style.display = 'none';
        if (mostrarAlerta) alert('Digite um endereço.');
        return;
    }
    try {
        const resposta = await fetch(
            'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=br&q=' + encodeURIComponent(endereco)
        );
        if (!resposta.ok) throw new Error('Falha na pesquisa');
        resultadosBusca = await resposta.json();
        sugestoesBusca.innerHTML = '';
        if (!resultadosBusca.length) {
            sugestoesBusca.style.display = 'none';
            if (mostrarAlerta) alert('Endereço não encontrado.');
            return;
        }
        resultadosBusca.forEach((resultado, indice) => {
            const item = document.createElement('button');
            item.type = 'button';
            item.setAttribute('role', 'option');
            item.textContent = resultado.display_name;
            item.style.cssText = 'display:block;width:100%;padding:10px;text-align:left;border:0;border-bottom:1px solid #eee;background:white;color:#111827;cursor:pointer;font-size:12px;line-height:1.4;';
            item.addEventListener('mouseenter', () => item.style.background = '#f3f4f6');
            item.addEventListener('mouseleave', () => item.style.background = 'white');
            item.addEventListener('click', () => selecionarEndereco(resultado));
            sugestoesBusca.appendChild(item);
        });
        sugestoesBusca.style.display = 'block';
        if (mostrarAlerta && resultadosBusca.length === 1) selecionarEndereco(resultadosBusca[0]);
    } catch (erro) {
        console.error('Erro na busca:', erro);
        sugestoesBusca.style.display = 'none';
        if (mostrarAlerta) alert('Não foi possível pesquisar o endereço. Verifique sua conexão e tente novamente.');
    }
}

campoBusca.addEventListener('input', () => {
    clearTimeout(temporizadorBusca);
    if (campoBusca.value.trim().length < 3) {
        sugestoesBusca.style.display = 'none';
        return;
    }
    temporizadorBusca = setTimeout(() => buscarEnderecos(false), 600);
});

campoBusca.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        event.preventDefault();
        buscarEnderecos(true);
    } else if (event.key === 'Escape') {
        sugestoesBusca.style.display = 'none';
    }
});

document.getElementById('btnBuscar').onclick = () => buscarEnderecos(true);
document.addEventListener('click', event => {
    if (!event.target.closest('#campoBusca') && !event.target.closest('#sugestoesBusca')) {
        sugestoesBusca.style.display = 'none';
    }
});

    // Guarda os marcadores das vagas

    // Busca as vagas na API
    async function atualizarVagas() {

        try {

            const resposta = await fetch('/vagas');

            // Quatro vagas deslocadas para o lado da rua,

let ocupadas = 0;

vagas.forEach(vaga => {
    if (vaga.status === "livre") {
        livres++;
    } else {
        ocupadas++;
    }
});

let total = vagas.length;

if (total > 0) {

}

document.getElementById("livres").textContent = livres;
document.getElementById("ocupadas").textContent = ocupadas;
document.getElementById("total").textContent = total;
document.getElementById("ocupacao").textContent = percentual + "%";

if (ultimaLocalizacaoUsuario &&
    document.getElementById('painelProximas').style.display !== 'none') {

}

vagas.forEach(vaga => {

    const marcadorExistente = marcadores[vaga.codigo];

    // Se o marcador já existe e o status não mudou,

    if (
        marcadorExistente &&
        marcadorExistente._status === vaga.status

    // Se o marcador existe e o status mudou, remove o antigo

        ${vaga.status.toUpperCase()}

</p>

</p>

">
    📋 Histórico recente
</h4>

        <div id="historico-${vaga.codigo}">
            Carregando histórico...
        </div>

                    </div>
    `, {

    });


marcador.on('popupopen', async function() {

    const container =
        document.getElementById(`historico-${vaga.codigo}`);

    if (!container) {
        return;
    }

    try {

        const resposta =
            await fetch('/historico');

        const historico =
            await resposta.json();

        const registrosVaga =
            historico.filter(
                registro => registro.vaga === vaga.codigo
            );

        if (registrosVaga.length === 0) {

            container.innerHTML =
                '<p>Nenhum histórico encontrado.</p>';

            return;
        }

        container.innerHTML = '';

        registrosVaga.slice(0, 3).forEach(registro => {

            const dataRecebida = registro.data_hora;

            const temFusoHorario =
                /Z$|[+-]\d{2}:\d{2}$/.test(dataRecebida);

            const data = new Date(
                temFusoHorario ? dataRecebida : dataRecebida + 'Z'
            );

            const dataFormatada = data.toLocaleString('pt-BR', {
                timeZone: 'America/Sao_Paulo'
            });

            const statusTexto =
                registro.status === 'livre'
                    ? '🟢 Livre'
                    : '🔴 Ocupada';

            const linha =
                document.createElement('div');

            linha.style.marginBottom = '4px';
linha.style.fontSize = '12px';

            linha.innerHTML = `
                <div>
                    <strong>${statusTexto}</strong>
                </div>

                <div style="
                    color:#666;
                    font-size:12px;
                ">
                    ${dataFormatada}
                </div>
            `;

            container.appendChild(linha);

        });

    } catch (erro) {

        console.error(
            'Erro ao carregar histórico:',
            erro
        );

        container.innerHTML =
            '<p>Erro ao carregar histórico.</p>';
    }

});

</script>
